spring.application.name=Insight-Service
server.port=9110

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

usage.service.url = http://localhost:9108/api/v1/energy-usage

spring.ai.ollama.chat.options.model=deepseek-coder
spring.ai.ollama.init.pull-model-strategy=never

device.service.url= http://localhost:9106/api/v1/devices
user.service.url= http://localhost:9105/api/v1/users
